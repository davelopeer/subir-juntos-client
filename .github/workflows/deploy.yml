# Faz deploy deste repositório (site estático) como Cloudflare Worker
# (Static Assets) a cada push na branch main.
#
# Secrets necessários (no repo subir-juntos-client > Settings >
# Secrets and variables > Actions > New repository secret):
#   CLOUDFLARE_API_TOKEN   - token com permissão "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - ID da sua conta Cloudflare
#
# O nome do Worker (em wrangler.toml) vira a URL:
# https://subir-juntos-client.<subdominio>.workers.dev
name: Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Usa o wrangler.toml da raiz (name + [assets]) para publicar
          # o site estático como Worker com Static Assets.
          command: deploy
