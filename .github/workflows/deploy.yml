# Faz deploy deste repositório (site estático) no Cloudflare Pages
# a cada push na branch main.
#
# Secrets necessários (no repo subir-juntos-client > Settings >
# Secrets and variables > Actions > New repository secret):
#   CLOUDFLARE_API_TOKEN   - token com permissão "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - ID da sua conta Cloudflare
#
# O nome do projeto (--project-name) vira a URL: https://grudados.pages.dev
name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # "." publica a raiz do repo (index.html, js/, assets/, style.css).
          # project-name precisa ser ÚNICO na sua conta Cloudflare.
          command: pages deploy . --project-name=grudados --branch=main
